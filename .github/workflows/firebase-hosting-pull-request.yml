# For every pull request into main: builds the web app and deploys it to a
# temporary Firebase preview URL (expires after 7 days). The URL is posted as
# a comment on the pull request, so a change can be tried before it goes live.
# The live site is not touched.

name: Deploy preview to Firebase Hosting (pull request)

on:
  pull_request:
    branches:
      - main

jobs:
  build_and_preview:
    # Secrets are not available to pull requests from forks; skip those.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze (fails on errors and warnings only)
        run: flutter analyze --no-fatal-infos

      - name: Build web (release)
        run: flutter build web --release

      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MONITORING_APP_WEB }}
          projectId: monitoring-app-web
          expires: 7d
